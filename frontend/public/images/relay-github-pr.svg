<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="748" viewBox="0 0 1200 748" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="1200" height="748" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="748" fill="#0d1117"/>

    <!-- top bar -->
    <rect x="0" y="0" width="1200" height="56" fill="#161b22"/>
    <line x1="0" y1="56" x2="1200" y2="56" stroke="#30363d"/>
    <circle cx="34" cy="28" r="12" fill="#e6edf3"/>
    <path d="M34 18a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48l-.01-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85l-.01 2.75c0 .27.18.58.69.48A10 10 0 0 0 34 18Z" fill="#0d1117"/>
    <text x="58" y="33" fill="#e6edf3" font-size="15" font-weight="600">renisha18 / repo-test</text>
    <text x="255" y="33" fill="#7d8590" font-size="15">Pull requests</text>
    <text x="376" y="33" fill="#7d8590" font-size="15">Actions</text>
    <text x="1120" y="33" fill="#7d8590" font-size="15" text-anchor="end">Watch  Fork  Star</text>

    <!-- PR title -->
    <text x="34" y="108" fill="#e6edf3" font-size="30" font-weight="600">Fix login button overflow on mobile <tspan fill="#7d8590" font-weight="400">#13</tspan></text>

    <!-- merged pill -->
    <rect x="34" y="128" width="118" height="34" rx="17" fill="#8957e5"/>
    <circle cx="55" cy="145" r="6" fill="#0d1117"/>
    <text x="70" y="150" fill="#ffffff" font-size="15" font-weight="600">Merged</text>
    <text x="168" y="150" fill="#7d8590" font-size="15"><tspan fill="#e6edf3" font-weight="600">relay-bot</tspan> merged 1 commit into <tspan fill="#e6edf3" font-family="ui-monospace, Menlo, monospace">main</tspan> from <tspan fill="#e6edf3" font-family="ui-monospace, Menlo, monospace">relay/fix-login-overflow</tspan>  ·  Closes #12</text>

    <line x1="34" y1="186" x2="1166" y2="186" stroke="#30363d"/>

    <!-- main column: checks card -->
    <rect x="34" y="212" width="770" height="196" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="62" cy="242" r="11" fill="#238636"/>
    <path d="M56.5 242l4 4 7-8" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="248" fill="#e6edf3" font-size="16" font-weight="600">All checks have passed</text>
    <text x="315" y="248" fill="#7d8590" font-size="14">4 signed attestations · Ed25519</text>
    <line x1="34" y1="268" x2="804" y2="268" stroke="#30363d"/>

    <g font-size="14.5">
      <circle cx="64" cy="294" r="6" fill="#3fb950"/><text x="82" y="299" fill="#e6edf3">Planner</text>
      <text x="180" y="299" fill="#7d8590">plan + declared scope signed</text>
      <text x="770" y="299" fill="#7d8590" text-anchor="end" font-family="ui-monospace, Menlo, monospace">did:key:z6Mk…HZxbV ✓</text>

      <circle cx="64" cy="324" r="6" fill="#3fb950"/><text x="82" y="329" fill="#e6edf3">Coder</text>
      <text x="180" y="329" fill="#7d8590">edits tool-locked to styles/login.css</text>
      <text x="770" y="329" fill="#7d8590" text-anchor="end" font-family="ui-monospace, Menlo, monospace">signed ✓</text>

      <circle cx="64" cy="354" r="6" fill="#3fb950"/><text x="82" y="359" fill="#e6edf3">Tester</text>
      <text x="180" y="359" fill="#7d8590">baseline diff — no new regressions</text>
      <text x="770" y="359" fill="#7d8590" text-anchor="end" font-family="ui-monospace, Menlo, monospace">signed ✓</text>

      <circle cx="64" cy="384" r="6" fill="#3fb950"/><text x="82" y="389" fill="#e6edf3">Reviewer</text>
      <text x="180" y="389" fill="#7d8590">in scope · tests green · trust 0.91</text>
      <text x="770" y="389" fill="#58a6ff" text-anchor="end" font-family="ui-monospace, Menlo, monospace">fast-approve ✓</text>
    </g>

    <!-- merge card -->
    <rect x="34" y="428" width="770" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="62" cy="462" r="11" fill="#238636"/>
    <path d="M56.5 462l4 4 7-8" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="468" fill="#e6edf3" font-size="16" font-weight="600">This branch has no conflicts with the base branch</text>
    <text x="84" y="492" fill="#7d8590" font-size="14">A human approved and squash-merged — Relay never merges on its own.</text>
    <rect x="84" y="512" width="220" height="44" rx="8" fill="#238636"/>
    <text x="194" y="540" fill="#ffffff" font-size="15.5" font-weight="600" text-anchor="middle">Squash and merge</text>
    <rect x="316" y="512" width="150" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="391" y="540" fill="#e6edf3" font-size="15" text-anchor="middle">View diff</text>

    <!-- right sidebar -->
    <text x="838" y="230" fill="#7d8590" font-size="13.5" font-weight="600">Reviewers</text>
    <circle cx="846" cy="256" r="7" fill="#3fb950"/>
    <text x="862" y="261" fill="#e6edf3" font-size="14">Relay  ·  approved</text>
    <line x1="838" y1="284" x2="1166" y2="284" stroke="#30363d"/>

    <text x="838" y="316" fill="#7d8590" font-size="13.5" font-weight="600">Labels</text>
    <rect x="838" y="330" width="150" height="26" rx="13" fill="#1f6feb"/>
    <text x="913" y="348" fill="#ffffff" font-size="12.5" text-anchor="middle">relay:fast-approve</text>
    <rect x="998" y="330" width="120" height="26" rx="13" fill="#2ea043"/>
    <text x="1058" y="348" fill="#ffffff" font-size="12.5" text-anchor="middle">bug</text>
    <line x1="838" y1="380" x2="1166" y2="380" stroke="#30363d"/>

    <text x="838" y="412" fill="#7d8590" font-size="13.5" font-weight="600">Assignees</text>
    <text x="838" y="438" fill="#e6edf3" font-size="14">renisha18</text>

    <!-- files changed / mini diff -->
    <line x1="34" y1="606" x2="1166" y2="606" stroke="#30363d"/>
    <text x="34" y="638" fill="#e6edf3" font-size="15" font-weight="600">1 file changed</text>
    <text x="182" y="638" fill="#3fb950" font-size="14" font-family="ui-monospace, Menlo, monospace">+3</text>
    <text x="214" y="638" fill="#f85149" font-size="14" font-family="ui-monospace, Menlo, monospace">−1</text>

    <rect x="34" y="654" width="1132" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="680" fill="#e6edf3" font-size="13.5" font-family="ui-monospace, Menlo, monospace">styles/login.css</text>
    <rect x="50" y="692" width="1100" height="22" rx="4" fill="#0d1117"/>
    <text x="60" y="708" fill="#f85149" font-size="12.5" font-family="ui-monospace, Menlo, monospace">-  .login-card .btn-primary { width: 400px; }</text>
    <text x="640" y="708" fill="#3fb950" font-size="12.5" font-family="ui-monospace, Menlo, monospace">+  .btn-primary { width: 100%; box-sizing: border-box; }</text>
  </g>
</svg>
